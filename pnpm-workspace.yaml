shamefullyHoist: true

packages:
  - 'foundation'
  - 'enterprise'
  - 'foundation/packages/*'
  # legacy 源码保留在 monorepo；默认 active 校验仍排除 account
  - 'account'
  - 'platform'
  - 'platform/packages/*'
  - 'aims'
  - 'workflow'
  - 'console'
  - 'webdev'
  - 'codocs'
  - 'codocs/slidev-service'
  - 'collab'
  - 'align'
  # 以下模块待试点验证后再纳入
  - 'altoc'
  - 'assets'
  - 'finance'
  - 'people'
  - 'insights'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  maplibre-gl: true
  playwright-chromium: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
overrides:
  nuxt: 4.4.8
  '@nuxt/schema': 4.4.8
  h3: 1.15.10
  'archiver-utils@5.0.2>glob': 13.0.6
  'mammoth@1.12.0>@xmldom/xmldom': 0.9.10
  'mdast-util-to-hast@13.2.1>@ungap/structured-clone': 1.3.3
  'pptx-preview@1.0.7>uuid': 14.0.1
  'pdfjs-dist@6.3.289>@napi-rs/canvas': 1.0.8
patchedDependencies:
  mammoth@1.12.0: patches/mammoth@1.12.0.patch
  nitropack@2.13.4: patches/nitropack@2.13.4.patch
